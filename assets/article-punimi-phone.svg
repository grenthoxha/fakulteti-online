<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img" aria-labelledby="title desc">
  <title id="title">Para se ta dorëzosh punimin</title>
  <desc id="desc">Pesë kontrolle për strukturën, burimet dhe qartësinë e punimit. Tre minuta lexim.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#091426"/>
      <stop offset=".62" stop-color="#102948"/>
      <stop offset="1" stop-color="#174678"/>
    </linearGradient>
    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#dceafa"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="38" flood-color="#030a15" flood-opacity=".45"/>
    </filter>
    <pattern id="grid" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M58 0H0v58" fill="none" stroke="#a8d0fa" stroke-opacity=".07"/>
    </pattern>
    <g id="brand" font-family="Arial, Helvetica, sans-serif">
      <path d="m96 134 28-14 28 14-28 14zM108 142v17q16 10 32 0v-17" fill="#9dd1ff"/>
      <text x="173" y="146" font-size="29" font-weight="700" letter-spacing="4" fill="#e4f1ff">FAKULTETI ONLINE</text>
    </g>
    <g id="headline" font-family="Arial, Helvetica, sans-serif">
      <text x="96" y="314" font-size="31" font-weight="700" letter-spacing="4" fill="#a5d3ff">UDHËZUES STUDENTOR</text>
      <text x="90" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="700" letter-spacing="-6" fill="#fff">Para se ta</text>
      <text x="90" y="604" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="700" letter-spacing="-6" fill="#fff">dorëzosh</text>
      <text x="90" y="734" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="700" letter-spacing="-6" fill="#9dd1ff">punimin.</text>
      <text x="96" y="818" font-size="34" fill="#d1e3f8">Një kontroll i fundit. Një punim më i qartë.</text>
    </g>
    <g id="illustration">
      <circle cx="621" cy="1214" r="327" fill="#80c1ff" fill-opacity=".10"/>
      <circle cx="621" cy="1214" r="287" fill="none" stroke="#a4d1ff" stroke-opacity=".16" stroke-width="2"/>
      <g transform="translate(185 987) rotate(-6 339 235)" filter="url(#shadow)">
        <rect x="36" y="28" width="678" height="470" rx="32" fill="#5090ce"/>
        <rect width="678" height="470" rx="32" fill="url(#paper)"/>
        <path d="M44 90h590" stroke="#aac5e2" stroke-width="2"/>
        <text x="46" y="61" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#22568c">PARA DORËZIMIT</text>
        <g fill="none" stroke="#2467aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <rect x="48" y="123" width="35" height="35" rx="9"/><path d="m58 140 7 7 11-13"/>
          <rect x="48" y="191" width="35" height="35" rx="9"/><path d="m58 208 7 7 11-13"/>
          <rect x="48" y="259" width="35" height="35" rx="9"/><path d="m58 276 7 7 11-13"/>
          <rect x="48" y="327" width="35" height="35" rx="9"/>
          <rect x="48" y="395" width="35" height="35" rx="9"/>
        </g>
        <g fill="#95b3d4">
          <rect x="113" y="135" width="378" height="11" rx="5"/>
          <rect x="113" y="203" width="438" height="11" rx="5"/>
          <rect x="113" y="271" width="330" height="11" rx="5"/>
          <rect x="113" y="339" width="408" height="11" rx="5"/>
          <rect x="113" y="407" width="362" height="11" rx="5"/>
        </g>
      </g>
      <circle cx="853" cy="1017" r="91" fill="#a5d3ff"/>
      <text x="853" y="1051" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="97" font-weight="700" fill="#102b4e">5</text>
    </g>
  </defs>
  <style>
    .landscape-layout { display:none; }
    @media (min-aspect-ratio: 5/4) {
      .portrait-layout { display:none; }
      .landscape-layout { display:inline; }
    }
  </style>
  <rect width="100%" height="100%" fill="url(#background)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <svg class="portrait-layout" x="5%" y="4%" width="90%" height="92%" viewBox="0 0 1080 1860" preserveAspectRatio="xMidYMid meet">
    <use href="#brand"/>
    <path d="M96 208h888" stroke="#8bb4e5" stroke-opacity=".4" stroke-width="2"/>
    <use href="#headline"/>
    <use href="#illustration"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <path d="M96 1606h888" stroke="#8bb4e5" stroke-opacity=".4" stroke-width="2"/>
      <text x="96" y="1682" font-size="40" font-weight="700" fill="#fff">5 kontrolle të fundit</text>
      <text x="96" y="1734" font-size="29" fill="#d1e3f8">Struktura · Burimet · Qartësia</text>
      <text x="984" y="1699" text-anchor="end" font-size="31" fill="#a5d3ff">3 min lexim</text>
    </g>
  </svg>
  <svg class="landscape-layout" x="4%" y="20%" width="92%" height="60%" viewBox="0 175 1600 540" preserveAspectRatio="xMidYMid meet">
    <path d="M96 655h1408" stroke="#8bb4e5" stroke-opacity=".4" stroke-width="2"/>
    <use href="#headline" transform="translate(25 -45) scale(.78)"/>
    <use href="#illustration" transform="translate(765 -485) scale(.73)"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="96" y="706" font-size="36" font-weight="700" fill="#fff">5 kontrolle të fundit</text>
      <text x="500" y="706" font-size="30" fill="#d1e3f8">Struktura · Burimet · Qartësia</text>
      <text x="1504" y="706" text-anchor="end" font-size="31" fill="#a5d3ff">3 min lexim</text>
    </g>
  </svg>
</svg>
