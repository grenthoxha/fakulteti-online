    <rect width="624" height="396" rx="22" fill="url(#paper)"/>
    <path d="M40 76h540" stroke="#d8e2ef" stroke-width="2"/>
    <text x="42" y="50" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3" fill="#64758c">KONTROLLI PARA DORËZIMIT</text>
    <g stroke="#10458c" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="44" y="106" width="28" height="28" rx="7"/><path d="m52 120 5 5 9-11"/>
      <rect x="44" y="163" width="28" height="28" rx="7"/><path d="m52 177 5 5 9-11"/>
      <rect x="44" y="220" width="28" height="28" rx="7"/><path d="m52 234 5 5 9-11"/>
      <rect x="44" y="277" width="28" height="28" rx="7"/>
      <rect x="44" y="334" width="28" height="28" rx="7"/>
