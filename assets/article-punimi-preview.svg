    <path d="M78 1280h924" stroke="#173959" stroke-opacity=".15"/>
    <text x="80" y="1344" font-size="32" font-weight="700" fill="#14263f">5 kontrolle të fundit</text>
    <text x="80" y="1390" font-size="23" fill="#61738b">Struktura · Burimet · Qartësia</text>
    <text x="1000" y="1365" text-anchor="end" font-size="25" fill="#10458c">3 min lexim</text>
