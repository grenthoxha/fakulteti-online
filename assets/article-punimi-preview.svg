<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">Para se ta dorëzosh punimin</title>
  <desc id="desc">Promovim i një artikulli shembull: pesë kontrolle të fundit për strukturën, burimet dhe qartësinë e një punimi studentor.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f4f6fa"/><stop offset="1" stop-color="#dfe9f5"/></linearGradient>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f1f5fa"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#0e284a" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <path d="M840 0v1440M900 0v1440M960 0v1440M1020 0v1440" stroke="#10458c" stroke-opacity=".04" stroke-width="2"/>
  <circle cx="1015" cy="824" r="355" fill="#1557b0" opacity=".055"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="m78 96 28-14 28 14-28 14zM90 104v17q16 10 32 0v-17" fill="#10458c"/>
    <text x="154" y="108" font-size="25" font-weight="700" letter-spacing="3" fill="#172c49">FAKULTETI ONLINE</text>
    <path d="M78 158h924" stroke="#173959" stroke-opacity=".15"/>
    <rect x="78" y="205" width="282" height="50" rx="25" fill="#10458c" fill-opacity=".08"/>
    <text x="105" y="237" font-size="19" font-weight="700" letter-spacing="2" fill="#10458c">ARTIKULL SHEMBULL</text>
    <text x="76" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="700" letter-spacing="-4" fill="#14263f">Para se ta</text>
    <text x="76" y="499" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="700" letter-spacing="-4" fill="#14263f">dorëzosh</text>
    <text x="76" y="616" font-family="Georgia, 'Times New Roman', serif" font-size="105" font-weight="700" letter-spacing="-4" fill="#10458c">punimin.</text>
    <text x="82" y="692" font-size="30" fill="#50647f">Një kontroll i fundit. Një punim më i qartë.</text>
  </g>
  <g transform="translate(238 802) rotate(-6 312 208)" filter="url(#shadow)">
